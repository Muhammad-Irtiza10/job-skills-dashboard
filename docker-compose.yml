# Run the whole app locally in containers:   docker compose up --build
# Then open http://localhost:8081   (see DOCKER.md)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: skillgap
      POSTGRES_USER: skillgap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillgap-local}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillgap -d skillgap"]
      interval: 5s
      retries: 10

  backend:
    build: .
    env_file:
      - path: .env        # email + JSearch keys (optional)
        required: false
    environment:          # these win over .env
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-docker-only-change-me-in-azure}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8081
      DB_HOST: db
      DB_NAME: skillgap
      DB_USER: skillgap
      DB_PASSWORD: ${DB_PASSWORD:-skillgap-local}
      FRONTEND_URL: http://localhost:8081
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:   # database files, kept between restarts
  media:    # uploaded profile photos
